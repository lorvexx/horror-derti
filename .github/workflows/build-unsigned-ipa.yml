
name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Build iOS app
        run: |
          xcodebuild \
            -project KRUTAYAIGRA.xcodeproj \
            -scheme KRUTAYAIGRA \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KRUTAYAIGRA.app Payload/
          zip -qr KRUTAYAIGRA-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KRUTAYAIGRA-unsigned-IPA
          path: KRUTAYAIGRA-unsigned.ipa
